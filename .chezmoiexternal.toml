{{- $os := "linux" -}}
{{- if eq .chezmoi.os "darwin" }}{{ $os = "macos" }}{{ end -}}
{{- $arch := .chezmoi.arch | replace "amd64" "x86_64" -}}

# neovim prebuilt binary
[".local"]
    type = "archive"
    url = "https://github.com/neovim/neovim/releases/download/stable/nvim-{{ $os }}-{{ $arch }}.tar.gz"
    stripComponents = 1
    refreshPeriod = "168h"

# tmux plugin manager
[".tmux/plugins/tpm"]
    type = "git-repo"
    url = "https://github.com/tmux-plugins/tpm.git"
    refreshPeriod = "168h"
    [".tmux/plugins/tpm".clone]
        args = ["--depth", "1"]

# oh-my-zsh
[".oh-my-zsh"]
    type = "git-repo"
    url = "https://github.com/ohmyzsh/ohmyzsh.git"
    refreshPeriod = "168h"
    [".oh-my-zsh".clone]
        args = ["--depth", "1"]

# zsh plugins
[".oh-my-zsh/custom/plugins/zsh-syntax-highlighting"]
    type = "git-repo"
    url = "https://github.com/zsh-users/zsh-syntax-highlighting.git"
    refreshPeriod = "168h"
    [".oh-my-zsh/custom/plugins/zsh-syntax-highlighting".clone]
        args = ["--depth", "1"]

[".oh-my-zsh/custom/plugins/zsh-autosuggestions"]
    type = "git-repo"
    url = "https://github.com/zsh-users/zsh-autosuggestions.git"
    refreshPeriod = "168h"
    [".oh-my-zsh/custom/plugins/zsh-autosuggestions".clone]
        args = ["--depth", "1"]

[".oh-my-zsh/custom/themes/powerlevel10k"]
    type = "git-repo"
    url = "https://github.com/romkatv/powerlevel10k.git"
    refreshPeriod = "168h"
    [".oh-my-zsh/custom/themes/powerlevel10k".clone]
        args = ["--depth", "1"]

# fzf
[".fzf"]
    type = "git-repo"
    url = "https://github.com/junegunn/fzf.git"
    refreshPeriod = "168h"
    [".fzf".clone]
        args = ["--depth", "1"]
